name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v prefix (e.g. 1.0.0)"
        required: true
        type: string

permissions:
  contents: write # create the release tag on workflow_dispatch

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "Version ${version} is not MAJOR.MINOR.PATCH"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Check version matches version.go
        run: |
          version=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' version.go)
          [ "${{ steps.version.outputs.version }}" = "${version}" ] \
            || { echo "Requested ${{ steps.version.outputs.version }} but version.go has ${version}"; exit 1; }
      - name: Run Tests
        run: go test -race ./...
      - name: Create release tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "${tag}" >/dev/null; then
            echo "Tag ${tag} already exists"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "${tag}"
      - name: Request pkg.go.dev index
        continue-on-error: true
        run: curl -sSf "https://proxy.golang.org/github.com/cronitorio/cronitor-go/@v/v${{ steps.version.outputs.version }}.info"
