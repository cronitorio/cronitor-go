---
name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.26 and 1.27 are the supported majors.
        # 1.21 is the minimum entry: the go directive in go.mod.
        go-version: ["1.21", "1.26", "1.27"]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Run Tests
        run: go test -race ./...
