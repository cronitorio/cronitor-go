name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Check tag is a semantic version
        run: |
          echo "${GITHUB_REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "Tag ${GITHUB_REF_NAME} is not vMAJOR.MINOR.PATCH"; exit 1; }
      - name: Run Tests
        run: go test -race ./...
      - name: Request pkg.go.dev index
        run: curl -sSf "https://proxy.golang.org/github.com/cronitorio/cronitor-go/@v/${GITHUB_REF_NAME}.info"
